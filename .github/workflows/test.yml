# Suite completa su Linux, Windows e macOS: il progetto è sviluppato su Windows e il codice POSIX va provato altrove.
# Un fallimento si classifica come nella prima verifica POSIX: piattaforma, difetto reale o ambiente (doc/08, doc/11).
name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kit/vault/requirements.txt ruff mypy
      - name: Identità Git di prova
        # I test creano repository sacrificabili: senza identità i commit fallirebbero; autocrlf spento per confrontare byte.
        run: |
          git config --global user.name "Teseo CI"
          git config --global user.email "ci@example.invalid"
          git config --global core.autocrlf false
          git config --global init.defaultBranch main
      - name: Lint (ruff.toml) e tipi (mypy.ini)
        run: |
          ruff check .
          mypy
      - name: Diagnosi Git (temporanea)
        # Windows: la suite riporta git_unavailable; qui si vede quale eccezione lo causa e dove sta git.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys, shutil
          sys.path.insert(0, ".")
          from kit.dashboard import git_sync
          print("::notice title=git_sync._executable::%s" % git_sync._executable("git"))
          print("::notice title=shutil.which::%s" % shutil.which("git"))
          print("::notice title=PATH assoluti::%s" % [d for d in os.environ.get("PATH", "").split(os.pathsep) if d and os.path.isabs(d)][:6])
          exe = git_sync._executable("git") or shutil.which("git")
          try:
              done = subprocess.run([exe, "--version"], capture_output=True, env=git_sync._env(), shell=False, timeout=30)
              print("::notice title=git --version::%s %s" % (done.returncode, done.stdout.decode()[:80]))
              done = subprocess.run([exe, "-c", "core.attributesFile=" + os.devnull, "-c", "core.hooksPath=" + os.devnull, "status"], capture_output=True, env=git_sync._env(), cwd=".", shell=False, timeout=30)
              print("::notice title=git status con -c NUL::%s %s" % (done.returncode, (done.stdout + done.stderr).decode(errors="replace")[:200].replace("\n", " ")))
          except Exception as error:
              print("::error title=eccezione::%s %s" % (type(error).__name__, error))
          PY
      - name: Suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee suite.log
      - name: Riassunto dei fallimenti
        if: failure()
        shell: bash
        run: python script/ci_riassunto.py suite.log
      - name: Installer in prova
        run: python installa.py --prova
