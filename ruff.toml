# Lo stile compatto (più istruzioni per riga) è voluto in questo codice; E701/E702 non sono difetti.
# E731/E741/F401 negli script legacy kit/graph, copiati nei vault, non si toccano da qui.
target-version = "py310"
exclude = ["tests/fixtures", "teseo-publisher-*"]

# Regole volute: errori di sintassi e di nome (E, F) e avvisi di spazi (W). Il resto dell'insieme predefinito di ruff
# (stile, modernizzazione, semplificazioni) non è una policy di questo progetto: si decide regola per regola, non in blocco.
# E501: le righe lunghe sono comuni e volute nello stile compatto.
[lint]
select = ["E", "F", "W"]
ignore = ["E701", "E702", "E501"]

[lint.per-file-ignores]
"kit/graph/*" = ["E731", "E741", "F401"]
"tests/*" = ["E402", "F841"]
